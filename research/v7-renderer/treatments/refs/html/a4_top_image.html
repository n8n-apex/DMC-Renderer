<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'SourceSerif';src:url('file:///Users/utkarsh/Projects/richard/research/v7-renderer/fonts/SourceSerif4%5Bopsz,wght%5D.ttf');font-weight:200 900;}
@font-face{font-family:'SourceSans';src:url('file:///Users/utkarsh/Projects/richard/research/v7-renderer/fonts/SourceSans3%5Bwght%5D.ttf');font-weight:200 900;}
:root{--cream:#F6F3ED;--ink:#2E3E50;--teal:#4A7C7E;--teal-light:#7FB7B3;--body:#3a4a5a;--rule:#cdc7ba;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:840px;height:1188px;}
body{background:var(--cream);font-family:'SourceSans',sans-serif;color:var(--body);position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* ===================== TOP IMAGE BAND (full-bleed) ===================== */
.hero{position:absolute;top:0;left:0;width:840px;height:486px;overflow:hidden;background:var(--ink);}
/* 1_founder.png native ar 1.562 -> at 840 wide it is 538 tall; band is 486 so face sits clear of foot scrim */
.hero .img{position:absolute;inset:0;
  background:url('file:///Users/utkarsh/Projects/richard/research/v7-renderer/fixtures/apex/assets/1_founder.png') center 26%/cover no-repeat;}
/* foot scrim so the overlaid caption seats cleanly */
.hero .scrim{position:absolute;left:0;right:0;bottom:0;height:170px;
  background:linear-gradient(to bottom,rgba(46,62,80,0) 0%,rgba(46,62,80,0.55) 55%,rgba(46,62,80,0.92) 100%);}
/* teal seam at the foot of the band */
.hero .seam{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--teal);z-index:4;}

/* overlaid eyebrow + caption on the scrim foot */
.hero .ov{position:absolute;left:64px;bottom:34px;right:64px;z-index:3;color:var(--cream);
  display:flex;align-items:flex-end;justify-content:space-between;}
.hero .ov .eb{display:flex;align-items:center;gap:14px;color:var(--teal-light);
  font-family:'SourceSans',sans-serif;font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;}
.hero .ov .eb .tick{width:34px;height:2px;background:var(--teal-light);}
.hero .ov .cap{text-align:right;}
.hero .ov .cap .name{font-family:'SourceSerif',serif;font-size:23px;font-weight:560;letter-spacing:.005em;color:var(--cream);}
.hero .ov .cap .role{font-family:'SourceSans',sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.22em;text-transform:uppercase;color:#9db0bd;margin-top:6px;}

/* ===================== CREAM EDITORIAL FIELD ===================== */
.field{position:absolute;left:64px;right:64px;top:486px;bottom:0;padding-top:84px;}

.headline{font-family:'SourceSerif',serif;color:var(--ink);font-weight:430;font-size:58px;line-height:1.05;letter-spacing:-0.014em;}
.headline .teal{color:var(--teal);}

.thesis{margin-top:34px;max-width:640px;font-size:20px;line-height:1.58;color:var(--body);font-weight:400;}
.thesis .lead{color:var(--ink);font-weight:600;}

.hairline{width:100%;height:1px;background:var(--rule);margin-top:64px;}

/* tidy 3-metric row */
.metrics{display:flex;margin-top:56px;}
.metric{flex:1;padding-right:30px;position:relative;}
.metric + .metric{padding-left:38px;}
.metric + .metric::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--rule);}
.metric .v{font-family:'SourceSerif',serif;font-size:52px;font-weight:500;color:var(--ink);line-height:1;letter-spacing:-0.015em;}
.metric .v .teal{color:var(--teal);}
.metric .l{font-family:'SourceSans',sans-serif;font-size:14px;font-weight:400;color:var(--body);
  line-height:1.4;margin-top:16px;max-width:200px;}
.metric .l b{color:var(--ink);font-weight:600;}

/* ===================== FOOTER ===================== */
.footer{position:absolute;left:64px;right:64px;bottom:46px;display:flex;align-items:center;justify-content:space-between;}
.footer .rule{position:absolute;left:0;right:0;top:-22px;height:1px;background:var(--rule);}
.brandmark{font-family:'SourceSerif',serif;font-size:15px;font-weight:600;letter-spacing:.36em;color:var(--ink);}
.pageno{font-family:'SourceSerif',serif;font-size:15px;color:var(--ink);font-weight:500;}
</style>
</head>
<body>
  <!-- ===== TOP IMAGE BAND ===== -->
  <div class="hero">
    <div class="img"></div>
    <div class="scrim"></div>
    <div class="ov">
      <div class="eb"><span class="tick"></span>Über uns</div>
      <div class="cap">
        <div class="name">Jousef Murad</div>
        <div class="role">Gründer · APEX</div>
      </div>
    </div>
    <div class="seam"></div>
  </div>

  <!-- ===== CREAM EDITORIAL FIELD ===== -->
  <div class="field">
    <h1 class="headline">Über 100 AI-Projekte.<br><span class="teal">Betrieb ohne Flaschenhals.</span></h1>
    <p class="thesis"><span class="lead">Wachstumsprobleme in B2B sind selten Umsatzprobleme.</span> Sie sind Automatisierungsprobleme.</p>
    <div class="hairline"></div>

    <div class="metrics">
      <div class="metric">
        <div class="v">100+</div>
        <div class="l">realisierte <b>AI-Projekte</b></div>
      </div>
      <div class="metric">
        <div class="v">€200k<span class="teal">+</span></div>
        <div class="l"><b>Einsparung</b> pro Jahr</div>
      </div>
      <div class="metric">
        <div class="v">30–50<span class="teal">%</span></div>
        <div class="l">weniger <b>Betriebskosten</b> ohne Mehr-Headcount</div>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="footer">
    <div class="rule"></div>
    <div class="brandmark">APEX</div>
    <div class="pageno">03</div>
  </div>
</body>
</html>
