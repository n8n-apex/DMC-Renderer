<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'SourceSerif';src:url('file:///Users/utkarsh/Projects/richard/research/v7-renderer/fonts/SourceSerif4%5Bopsz,wght%5D.ttf') format('truetype');font-weight:200 900;}
@font-face{font-family:'SourceSans';src:url('file:///Users/utkarsh/Projects/richard/research/v7-renderer/fonts/SourceSans3%5Bwght%5D.ttf') format('truetype');font-weight:200 900;}
:root{--cream:#F6F3ED;--ink:#2E3E50;--teal:#4A7C7E;--body:#3a4a5a;--rule:#cdc7ba;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1680px;height:1188px;}
body{background:var(--cream);font-family:'SourceSans',sans-serif;color:var(--body);position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* ============== RIGHT NAVY PORTRAIT PANEL (~46% width) ============== */
.panel{position:absolute;top:0;right:0;width:773px;height:1188px;background:var(--ink);overflow:hidden;}
.panel .seam{position:absolute;top:0;bottom:0;left:0;width:4px;background:var(--teal);z-index:4;}
/* full-bleed founder portrait — native ar 0.821, cover keeps the face intact */
.portrait{position:absolute;top:0;left:4px;right:0;bottom:0;
  background:url('file:///Users/utkarsh/Projects/richard/research/v7-renderer/fixtures/apex/assets/1_founder.jpg') center 20%/cover no-repeat;}
/* foot scrim so the name seats cleanly over the portrait foot */
.portrait::after{content:'';position:absolute;left:0;right:0;bottom:0;height:360px;
  background:linear-gradient(to bottom,rgba(46,62,80,0) 0%,rgba(46,62,80,0.55) 52%,rgba(46,62,80,0.94) 100%);}
.pcap{position:absolute;left:62px;bottom:74px;z-index:3;color:var(--cream);}
.pcap .tick{width:46px;height:3px;background:var(--teal);margin-bottom:26px;}
.pcap .name{font-family:'SourceSerif',serif;font-size:46px;font-weight:540;letter-spacing:.005em;line-height:1;}
.pcap .role{font-family:'SourceSans',sans-serif;font-size:14px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#9db0bd;margin-top:16px;}

/* ============== LEFT EDITORIAL FIELD ============== */
.stage{position:absolute;left:90px;top:90px;width:737px;height:1008px;}
/* 90 + 737 = 827; panel starts at 1680-773=907 -> 80px gutter to panel */

.eyebrow{display:flex;align-items:center;gap:18px;color:var(--teal);font-size:15px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;}
.eyebrow .tick{width:46px;height:2px;background:var(--teal);}
.eyebrow .pg{margin-left:auto;color:#b3a998;letter-spacing:.2em;font-family:'SourceSerif',serif;font-size:16px;font-weight:500;}

.headline{font-family:'SourceSerif',serif;color:var(--ink);font-weight:430;font-size:74px;line-height:1.04;letter-spacing:-0.014em;margin-top:46px;}
.headline .teal{color:var(--teal);}

.thesis{margin-top:42px;max-width:620px;font-size:21px;line-height:1.62;color:var(--body);font-weight:400;}
.thesis .lead{color:var(--ink);font-weight:600;}

.hairline{width:620px;height:1px;background:var(--rule);margin-top:54px;}

/* ---------- vertical 3-metric stack ---------- */
.metrics{position:absolute;left:90px;top:708px;width:620px;}
.metric{border-left:3px solid var(--teal);padding:0 0 0 28px;margin-bottom:28px;}
.metric:last-child{margin-bottom:0;}
.metric .v{font-family:'SourceSerif',serif;font-size:54px;font-weight:500;color:var(--ink);line-height:1;letter-spacing:-0.012em;}
.metric .l{font-family:'SourceSans',sans-serif;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--body);margin-top:12px;}

/* ---------- footer ---------- */
.footrule{position:absolute;left:90px;top:1054px;width:620px;height:1px;background:var(--rule);}
.footer{position:absolute;left:90px;top:1080px;width:620px;display:flex;align-items:center;justify-content:space-between;}
.brandmark{font-family:'SourceSerif',serif;font-size:16px;font-weight:600;letter-spacing:.36em;color:var(--ink);}
.pageno{font-family:'SourceSerif',serif;font-size:16px;color:var(--ink);font-weight:500;}
</style>
</head>
<body>
  <!-- LEFT: editorial field -->
  <div class="stage">
    <div class="eyebrow"><span class="tick"></span>ÜBER UNS<span class="pg">03</span></div>
    <h1 class="headline">Über 100 AI-Projekte.<br><span class="teal">Betrieb ohne Flaschenhals.</span></h1>
    <p class="thesis"><span class="lead">Wachstumsprobleme in B2B sind selten Umsatzprobleme.</span> Sie sind Automatisierungsprobleme.</p>
    <div class="hairline"></div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="v">100+</div><div class="l">realisierte AI-Projekte</div></div>
    <div class="metric"><div class="v">€200k+</div><div class="l">Einsparung pro Jahr</div></div>
    <div class="metric"><div class="v">30&ndash;50%</div><div class="l">weniger Betriebskosten · ohne Mehr-Headcount</div></div>
  </div>

  <div class="footrule"></div>
  <div class="footer">
    <div class="brandmark">APEX</div>
    <div class="pageno">03</div>
  </div>

  <!-- RIGHT: navy portrait panel -->
  <div class="panel">
    <div class="seam"></div>
    <div class="portrait"></div>
    <div class="pcap">
      <div class="tick"></div>
      <div class="name">Jousef Murad</div>
      <div class="role">Gründer · APEX</div>
    </div>
  </div>
</body>
</html>
